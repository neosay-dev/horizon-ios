[package]
name = "horizon-ios"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The iOS app's Rust side: the game as a static library the Swift launcher starts (ios/)"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
# No controllers (gilrs has no iOS backend; GameController.framework later). Horizon's extras are
# on: its Settings and Mods pages (the built-in mods' switches and settings), Play with Friends.
horizon-client = { path = "../horizon-client", default-features = false, features = ["audio", "system-allocator", "horizon-extras"] }
serde_json = "1"
log = "0.4"

[lints]
workspace = true

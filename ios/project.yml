# XcodeGen spec: `xcodegen` here makes Horizon.xcodeproj (CI does it: .github/workflows/ios.yml).
name: Horizon
options:
  bundleIdPrefix: dev.neosay
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # The Rust library (crates/horizon-ios), built first by build-rust.sh.
    RUST_LIB_DIR: $(SRCROOT)/../target/aarch64-apple-ios/fast
    # Your own Azure app's client ID, approved by Mojang (README). Empty: local accounts only.
    HZ_MSA_CLIENT_ID: ""
targets:
  Horizon:
    type: application
    platform: iOS
    sources:
      - path: Horizon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.neosay.horizon
        PRODUCT_NAME: Horizon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: Horizon/Bridge/Horizon-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/Horizon/Bridge
        LIBRARY_SEARCH_PATHS: $(RUST_LIB_DIR)
        OTHER_LDFLAGS: -lhorizon_ios -lc++ -lresolv
        ENABLE_BITCODE: NO
        DEAD_CODE_STRIPPING: YES
        # winit's view drives the frames; Metal through wgpu.
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Horizon/Info.plist
      properties:
        CFBundleDisplayName: Horizon
        HZMSAClientID: $(HZ_MSA_CLIENT_ID)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Documents in the Files app and Finder: resources/26.3, game/saves.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Trackpad and mouse on iPad reach winit as pointer events.
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.games
    # The game's memory: the larger limit where the device allows it.
    entitlements:
      path: Horizon/Horizon.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.developer.kernel.extended-virtual-addressing: true
    dependencies:
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: UIKit.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: CoreFoundation.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: GameController.framework

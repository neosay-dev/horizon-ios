# XcodeGen spec: `xcodegen` here makes Horizon.xcodeproj (CI does it: .github/workflows/ios.yml).
name: Horizon
options:
  bundleIdPrefix: dev.neosay
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # The Rust library (crates/horizon-ios), built first by build-rust.sh.
    RUST_LIB_DIR: $(SRCROOT)/../target/aarch64-apple-ios/ios
    # Your own Azure app's client ID, approved by Mojang (README). Empty: local accounts only.
    HZ_MSA_CLIENT_ID: ""
targets:
  Horizon:
    type: application
    platform: iOS
    sources:
      - path: Horizon
      # Horizon's registry built in (registry_mods.py, CI): content mods, resource packs and shader packs the
      # launcher copies into the game folder once, and the native mods' content beside the game, where it reads it
      # (Horizon.app/native-content, the executable's folder).
      - path: registry-out/Registry
        type: folder
        optional: true
        buildPhase: resources
      - path: registry-out/native-content
        type: folder
        optional: true
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.neosay.horizon
        PRODUCT_NAME: Horizon
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: Horizon/Bridge/Horizon-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/Horizon/Bridge
        LIBRARY_SEARCH_PATHS: $(RUST_LIB_DIR)
        OTHER_LDFLAGS: -lhorizon_ios -lc++ -lresolv
        ENABLE_BITCODE: NO
        DEAD_CODE_STRIPPING: YES
        # winit's view drives the frames; Metal through wgpu.
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        # The icon: Horizon/Assets.xcassets/AppIcon.appiconset (one 1024 px image).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Horizon/Info.plist
      properties:
        CFBundleDisplayName: Horizon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The original launcher's typefaces (crates/horizon-theme/fonts, OFL).
        UIAppFonts:
          - Geist-Regular.ttf
          - Geist-Medium.ttf
          - Geist-SemiBold.ttf
          - GeistMono-Regular.ttf
        HZMSAClientID: $(HZ_MSA_CLIENT_ID)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        # ProMotion iPhones: without this key iOS holds an app at 60 Hz.
        CADisableMinimumFrameDuration: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Documents in the Files app and Finder: resources/26.3, game/saves.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Trackpad and mouse on iPad reach winit as pointer events.
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        # Servers and LAN worlds on the local network: without this text iOS blocks those
        # connections without asking (iOS 14+).
        NSLocalNetworkUsageDescription: Horizon подключается к серверам и мирам в локальной сети (LAN).
        LSApplicationCategoryType: public.app-category.games
        # Built-in mods (Simple Voice Chat): iOS ends an app that opens the microphone without this text.
        NSMicrophoneUsageDescription: Голосовой чат в игре (мод Simple Voice Chat).
    # The game's memory: the larger limit where the device allows it.
    entitlements:
      path: Horizon/Horizon.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.developer.kernel.extended-virtual-addressing: true
    dependencies:
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: UIKit.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: CoreFoundation.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: GameController.framework

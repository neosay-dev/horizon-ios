# The iOS app: the Rust game as a static library, the Swift launcher, an unsigned IPA to sideload.
# Runs on iOS port changes, or manually (Actions → iOS → Run workflow). Optional HZ_MSA_CLIENT_ID:
# your own Azure app's client ID, approved by Mojang (ios/README.md).
name: iOS

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release this build as version (e.g. 0.1.0): tag ios-v<version>, notes from ios/RELEASE_NOTES.md"
        required: false
        default: ""
  push:
    branches: [ios-port]
    # A release: push a tag `ios-v<version>`; the IPA goes onto the GitHub release of that tag.
    tags: ['ios-v*']
    paths:
      - .github/workflows/ios.yml
      - .cargo/**
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - ios/**

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 240
    defaults:
      run:
        # Explicit bash enables pipefail, so tee/tail cannot hide build failures.
        shell: bash
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      CARGO_TERM_COLOR: always
      # The `fast` profile (16 codegen units, no LTO): horizon-client builds on every core.
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Local account tests
        run: |
          test_dir=$(mktemp -d)
          swiftc ios/Horizon/Account/LocalAccount.swift ios/Tests/LocalAccountTests.swift -o "$test_dir/local-account-tests"
          "$test_dir/local-account-tests"

      - name: Rust for iOS
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          key: ios
          cache-targets: true
          cache-on-failure: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Horizon's registry built in: the native (Rust) mods that apply and compile for the iPhone are written into
      # the game's source here (an iPhone can't compile them), the content mods, resource packs and shader packs go
      # into the app (ios/registry_mods.py).
      - name: Registry mods (built in)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 https://github.com/horizon-rust/horizon-mods "$RUNNER_TEMP/horizon-mods"
          feature=$(python3 ios/registry_mods.py --registry "$RUNNER_TEMP/horizon-mods" --out ios/registry-out \
            2> >(tee registry-mods.log >&2))
          echo "HZ_MODS_FEATURE=$feature" >> "$GITHUB_ENV"
          python3 -c "import json; r = json.load(open('ios/registry-out/Registry/registry.json')); \
            print('native:', ', '.join(m['id'] for m in r['native']) or '-'); \
            print('content:', len(r['content']), 'left out:', len(r['left_out']))"

      - name: Game library (crates/horizon-ios)
        run: |
          features=()
          if [ "${HZ_MODS_FEATURE:-0}" = 1 ]; then features=(--features horizon-client/mods); fi
          cargo build --profile fast -p horizon-ios --target aarch64-apple-ios "${features[@]}" 2>&1 | tee rust-ios-build.log

      - name: Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: App (unsigned)
        run: |
          cd ios
          xcodebuild -project Horizon.xcodeproj -scheme Horizon -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            HZ_MSA_CLIENT_ID="${{ vars.HZ_MSA_CLIENT_ID }}" \
            build 2>&1 | tee ../xcode-ios-build.log | tail -n 200

      - name: Build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Horizon-ios-build-logs-${{ github.run_number }}
          path: |
            rust-ios-build.log
            xcode-ios-build.log
            registry-mods.log
            ios/registry-out/Registry/registry.json
          if-no-files-found: ignore

      - name: IPA
        run: |
          cd ios
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Horizon.app Payload/
          zip -qry ../Horizon-unsigned.ipa Payload
          ls -lh ../Horizon-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Horizon-ios-unsigned-${{ github.run_number }}
          path: Horizon-unsigned.ipa

      - name: Release
        if: startsWith(github.ref, 'refs/tags/ios-v') || inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          if [ -n "$RELEASE" ]; then tag="ios-v${RELEASE#v}"; else tag="${GITHUB_REF_NAME}"; fi
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --target "$GITHUB_SHA" --title "Horizon iOS ${tag#ios-v}" \
              --notes-file ios/RELEASE_NOTES.md --latest
          cp Horizon-unsigned.ipa "Horizon-${tag#ios-v}.ipa"
          gh release upload "$tag" "Horizon-${tag#ios-v}.ipa" --clobber
          # AltStore / SideStore source, every ios-v release in it:
          # https://github.com/<repo>/releases/latest/download/altstore.json
          python3 ios/altstore_source.py "$GITHUB_REPOSITORY" > altstore.json
          gh release upload "$tag" altstore.json --clobber

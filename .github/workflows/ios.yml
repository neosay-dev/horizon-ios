# The iOS app: the Rust game as a static library, the Swift launcher, an unsigned IPA to sideload.
# Runs on iOS port changes, or manually (Actions → iOS → Run workflow). Optional HZ_MSA_CLIENT_ID:
# your own Azure app's client ID, approved by Mojang (ios/README.md).
name: iOS

on:
  workflow_dispatch:
  push:
    branches: [ios-port]
    # A release: push a tag `ios-v<version>`; the IPA goes onto the GitHub release of that tag.
    tags: ['ios-v*']
    paths:
      - .github/workflows/ios.yml
      - .cargo/**
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - ios/**

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 120
    defaults:
      run:
        # Explicit bash enables pipefail, so tee/tail cannot hide build failures.
        shell: bash
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      CARGO_TERM_COLOR: always
      # The `fast` profile (16 codegen units, no LTO): horizon-client builds on every core.
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Local account tests
        run: |
          test_dir=$(mktemp -d)
          swiftc ios/Horizon/Account/LocalAccount.swift ios/Tests/LocalAccountTests.swift -o "$test_dir/local-account-tests"
          "$test_dir/local-account-tests"

      - name: Rust for iOS
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          key: ios
          cache-targets: true
          cache-on-failure: true

      - name: Game library (crates/horizon-ios)
        run: cargo build --profile fast -p horizon-ios --target aarch64-apple-ios 2>&1 | tee rust-ios-build.log

      - name: Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: App (unsigned)
        run: |
          cd ios
          xcodebuild -project Horizon.xcodeproj -scheme Horizon -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            HZ_MSA_CLIENT_ID="${{ vars.HZ_MSA_CLIENT_ID }}" \
            build 2>&1 | tee ../xcode-ios-build.log | tail -n 200

      - name: Build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Horizon-ios-build-logs-${{ github.run_number }}
          path: |
            rust-ios-build.log
            xcode-ios-build.log
          if-no-files-found: ignore

      - name: IPA
        run: |
          cd ios
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Horizon.app Payload/
          zip -qry ../Horizon-unsigned.ipa Payload
          ls -lh ../Horizon-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Horizon-ios-unsigned-${{ github.run_number }}
          path: Horizon-unsigned.ipa

      - name: Release
        if: startsWith(github.ref, 'refs/tags/ios-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "Horizon iOS ${tag#ios-v}" --notes-file ios/RELEASE_NOTES.md
          cp Horizon-unsigned.ipa "Horizon-${tag#ios-v}.ipa"
          gh release upload "$tag" "Horizon-${tag#ios-v}.ipa" --clobber
